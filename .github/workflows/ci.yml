name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    name: Python ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/.github
          ref: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          path: .third-party-allowlist
          persist-credentials: false

      - name: Verify the pinned checkout
        # Generated by pin-github-checks.mjs -- edit the pin with that tool, not by
        # hand. The ref above is a commit SHA, and every file the fetched code reads
        # is hashed here, so a push to the source repo cannot change what runs in
        # this workflow until someone reviews it and re-pins. It runs from the
        # workspace with nothing preloaded, so neither the job's working-directory
        # nor a variable an earlier step left behind decides what it reads or runs.
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          NODE_OPTIONS: ""
          NODE_PATH: ""
          BASH_ENV: ""
          ENV: ""
          PIN_ROOT: .third-party-allowlist
          PIN_DIR: .third-party-allowlist/third-party
          PIN_SHA: b3b5e499c78467bd1e98d80af23a6b4861489ac5
          PIN_SHA256: |
            4b94acfac87136b0942123b9f227919d7e2e3d67863bcdceba32c9a73f765db0  check.mjs
            1547306d567749d7410040cae2bfb9a648902de95c3378f6c5af54245c896e11  gate-graph.mjs
            b9423fcbc59c06b38862841f7111817cf586a3f5e7bcaf34349f26f7515b782d  allowlist.json
        run: |
          node -e '
          const fs = require("node:fs");
          const crypto = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const env = process.env;
          const fail = [];
          const head = execFileSync("git", ["-C", env.PIN_ROOT, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (head !== env.PIN_SHA) fail.push("checkout is at " + head + ", pinned " + env.PIN_SHA);
          const want = env.PIN_SHA256.split(String.fromCharCode(10)).map((l) => l.trim()).filter(Boolean);
          if (!want.length) fail.push("no file hashes are pinned");
          for (const entry of want) {
            const [hash, ...rest] = entry.split(" ").filter(Boolean);
            const file = rest.join(" ");
            let got = "missing";
            try {
              const text = fs.readFileSync(env.PIN_DIR + "/" + file, "latin1");
              const lf = text.split(String.fromCharCode(13, 10)).join(String.fromCharCode(10));
              got = crypto.createHash("sha256").update(lf, "latin1").digest("hex");
            } catch {}
            if (got !== hash) fail.push(file + " sha256 is " + got + ", pinned " + hash);
          }
          for (const f of fail) console.log("::error::Pinned checkout mismatch: " + f);
          if (fail.length) {
            console.log("::error::Refusing to run fetched code that does not match its pin. Review the upstream change, then re-pin with pin-github-checks.mjs.");
            process.exit(1);
          }
          console.log("Pinned checkout verified: " + head + ", " + want.length + " files match.");
          '

      - name: Third-party dependency allowlist
        run: |
          node .third-party-allowlist/third-party/check.mjs --repo .
          # Delete it. A fetched checkout left lying in the workspace is not
          # inert: vitest globbed the checker's own tests out of it and failed
          # a package whose code was fine. Removed with node, not rm -rf,
          # because some of these matrices run on windows-latest where a
          # multi-line run: block is PowerShell and rm -rf is not a command.
          node -e "require('node:fs').rmSync('.third-party-allowlist',{recursive:true,force:true})"

      # The shared conformance fixtures. Checked out, NOT skipped when absent:
      # a conformance suite that silently does not run reads exactly like full
      # coverage in a green log, which is the mechanism that hid two-way drift
      # in this org before.
      #
      # At the TAG the suite pins (PINNED_SUITE_VERSION in tests/test_money.py),
      # never `main`. The pin is the contract: moving it is a deliberate commit
      # here, never a side effect of someone else's release. With no `ref`, every
      # fixture release turned this build red for a reason no commit in this
      # repository caused, and it sat red for weeks. A test fails if this ref and
      # the pin disagree.
      - name: Check out fancy-conformance
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-conformance
          ref: v0.22.1
          path: .conformance
          persist-credentials: false

      # The gating twin, which OWNS the shared feature contract this package's
      # bridge imports.
      - name: Check out fancy-features-py
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/fancy-features-py
          path: .fancy-features-py
          persist-credentials: false

      # The PHP twin, for the Live Contract parity check. Drift there is
      # invisible at runtime: a renamed event does not throw, it just leaves a
      # cache nobody invalidated and a UI that stops updating.
      - name: Check out laravel-catalog
        uses: actions/checkout@v7
        with:
          repository: Particle-Academy/laravel-catalog
          path: .laravel-catalog
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # The gating twin's checkout FIRST, so the `test` group's
          # `fancy-features` requirement is already satisfied by it rather than
          # by the PyPI release. `fancy-conformance` is in no group -- it is
          # never published to PyPI -- and reaches the suite through PYTHONPATH
          # on the Test steps below.
          python -m pip install -e ./.fancy-features-py
          python -m pip install -e . --group dev

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy

      # PYTHONPATH supplies the shared `fancy_conformance` loader from the
      # checkout this job made, at the pinned tag. `--override-ini="pythonpath="`
      # clears only pyproject's `pythonpath` (src/ and the envelope's sibling
      # paths, none of which exist here); it does not touch PYTHONPATH.
      - name: Test
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
          PYTHONPATH: ${{ github.workspace }}/.conformance/python/src
          CATALOG_PHP_SRC: ${{ github.workspace }}/.laravel-catalog/src
        # `-W error::UserWarning` turns the Live Contract parity check's
        # "did not run" report into a failure HERE, where the twin is checked
        # out and there is no excuse for it. Locally it stays a warning.
        run: pytest -ra -W error::UserWarning --override-ini="pythonpath="

      # Only a built wheel proves the distribution is complete. `pythonpath`
      # makes a bare checkout runnable and hides an unshipped file.
      - name: Test the built wheel
        env:
          FANCY_CONFORMANCE_ROOT: ${{ github.workspace }}/.conformance
          PYTHONPATH: ${{ github.workspace }}/.conformance/python/src
          CATALOG_PHP_SRC: ${{ github.workspace }}/.laravel-catalog/src
        run: |
          python -m pip install --upgrade build
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python -c "import fancy_catalog, pathlib; \
            assert (pathlib.Path(fancy_catalog.__file__).parent / 'py.typed').is_file(), \
            'py.typed did not ship'"
          pytest -ra -p no:cacheprovider --override-ini="pythonpath="
